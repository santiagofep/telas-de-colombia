    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

      const s = document.createElement('script');

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

    // which fired before we swapped the document. Trigger manually if present.

      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

ing:0.14em; text-transform:uppercase; color:var(--faint);\">By Grupo Macasi<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"display:flex; align-items:center; gap:28px; font-size:14px; color:var(--body);\">\n      <a href=\"#galeria\" style=\"color:var(--body);\">Telas<\u002Fa>\n      <a href=\"#mayoristas\" style=\"color:var(--body);\">Mayoristas<\u002Fa>\n      <a href=\"#dotaciones\" style=\"color:var(--body);\">Dotaciones<\u002Fa>\n      <a href=\"#ubicacion\" style=\"color:var(--body);\">Visítanos<\u002Fa>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Cambiar tema\" style=\"display:inline-flex; align-items:center; gap:8px; background:transparent; border:1px solid var(--line); color:var(--body); border-radius:999px; padding:9px 14px; font-family:inherit; font-size:13px; cursor:pointer;\" style-hover=\"border-color:var(--faint);\">{{ themeLabel }}<\u002Fbutton>\n      <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ trackWhatsapp }}\" style=\"display:inline-flex; align-items:center; gap:8px; background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:999px; font-size:14px; font-weight:500;\" style-hover=\"background:var(--ink-hover);\">\n        <span style=\"width:7px; height:7px; border-radius:50%; background:var(--cta); display:inline-block;\"><\u002Fspan>\n        Escríbenos\n      <\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section style=\"display:grid; grid-template-columns:1.05fr 1fr; gap:56px; align-items:center; padding:56px 0 72px; border-top:1px solid var(--line);\">\n    <div>\n      <p style=\"margin:0 0 20px; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent);\">Telas al detal y al por mayor · Dotaciones<\u002Fp>\n      <h1 style=\"margin:0 0 22px; font-family:'Instrument Sans','Inter',sans-serif; font-size:64px; line-height:1.04; letter-spacing:-0.035em; font-weight:600; text-wrap:balance;\">Tus aliados en tela para crear algo mplate-rows:200px 200px; gap:12px;\">\n      <div style=\"grid-column:1 / -1; background:repeating-linear-gradient(45deg,var(--ph1) 0 10px,var(--ph2) 10px 20px); border-radius:6px; display:flex; align-items:flex-end; padding:14px;\">\n        <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--muted); background:var(--bg); padding:5px 8px; border-radius:3px;\">rollos en bodega — foto ancha<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:repeating-linear-gradient(45deg,var(--ph1) 0 10px,var(--ph2) 10px 20px); border-radius:6px; display:flex; align-items:flex-end; padding:14px;\">\n        <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--muted); background:var(--bg); padding:5px 8px; border-radius:3px;\">detalle de seda<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:repeating-linear-gradient(45deg,var(--ph1) 0 10px,var(--ph2) 10px 20px); border-radius:6px; display:flex; align-items:flex-end; padding:14px;\">\n        <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--muted); background:var(--bg); padding:5px 8px; border-radius:3px;\">mostrador<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"galeria\" style=\"padding:64px 0; border-top:1px solid var(--line);\">\n    <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:32px;\">\n      <h2 style=\"margin:0; font-family:'Instrument Sans','Inter',sans-serif; font-size:38px; font-weight:600; letter-spacing:-0.03em;\">Nuestras telas<\u002Fh2>\n      <p style=\"margin:0; font-size:14px; color:var(--muted); max-width:38ch; text-align:right;\">Pide el catálogo o una muestra física antes de comprar el rollo.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:20px;\">\n      <sc-for list=\"{{ telas }}\" as=\"tela\" hint-placeholder-count=\"6\">\n        <article style= on style=\"padding:64px 0; border-top:1px solid var(--line);\">\n    <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:32px;\">\n      <h2 style=\"margin:0; font-family:'Instrument Sans','Inter',sans-serif; font-size:38px; font-weight:600; letter-spacing:-0.03em;\">Reseñas en Google<\u002Fh2>\n      <a href=\"{{ googleReviewsUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:14px; font-weight:500;\">Ver todas en Google →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:0.68fr 2fr; gap:20px; align-items:stretch;\">\n      <div style=\"background:var(--surface); border:1px solid var(--line2); border-radius:8px; padding:28px; display:flex; flex-direction:column; justify-content:center; gap:10px;\">\n        <div style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--faint);\">Google<\u002Fdiv>\n        <div style=\"font-family:'Instrument Sans','Inter',sans-serif; font-size:52px; font-weight:600; letter-spacing:-0.04em; line-height:1;\">{{ googleRating }}<\u002Fdiv>\n        <div style=\"font-size:20px; letter-spacing:0.12em; color:var(--accent);\">{{ googleStars }}<\u002Fdiv>\n        <div style=\"font-size:14px; color:var(--muted);\">{{ googleCount }} reseñas · Telas de Colombia SAS<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:20px;\">\n        <sc-for list=\"{{ reviews }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <figure style=\"margin:0; background:var(--surface); border:1px solid var(--line2); border-radius:8px; padding:24px; display:flex; flex-direction:column; gap:16px;\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px;\">\n              <span style=\"font-size:15px; letter-spacing:0.1em; color:var(--accent);\">{{ r.estrellas }}<\u002Fspan>\n              <span style=\"font-size:12px; color:var(--faint);\">{{ r.fecha }}<\u002Fspan>\n            <\u002Fdiv>\n            <blockquote style=\"margin:0; font-size:15px; line-height:1.6; color:var(--body); text-wrap:pretty; flex:1;\">{{ r.texto }}<\u002Fblockquote>\n            <figcaption style=\"display:flex; align-items:center; gap:12px; font-size:13px; color:var(--muted);\">\n              <span style=\"width:34px; height:34px; border-radius:50%; background:var(--ph1); color:var(--accent); font-weight:600; display:flex; align-items:center; justify-content:center; flex:none;\">{{ r.inicial }}<\u002Fspan>\n              <span>{{ r.autor }}<br><span style=\"color:var(--faint);\">Reseña de Google<\u002Fspan><\u002Fspan>\n            <\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"dotaciones\" style=\"padding:64px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr 1.15fr; gap:56px; align-items:center;\">\n    <div>\n      <p style=\"margin:0 0 16px; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent);\">Dotaciones<\u002Fp>\n      <h2 style=\"margin:0 0 18px; font-family:'Instrument Sans','Inter',sans-serif; font-size:38px; font-weight:600; letter-spacing:-0.03em;\">Dotación corporativa de alto volumen<\u002Fh2>\n      <p style=\"margin:0 0 26px; font-size:16px; line-height:1.6; color:var(--body); max-width:46ch;\">Somos integrador logístico textil: producimos y despachamos dotación para empresas B2B a nivel nacional, con control de calidad en cada lote.<\u002Fp>\n      <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ trackWhatsapp }}\" style=\"display:inline-flex; align-items:center; gap:10px; border:1px solid var(--ink); color:var(--ink); padding:14px 22px; border-radius:999px; font-size:15px; font-weight:600;\" style-hover=\"background:var(--ink); color:var(--bg);\">Pedir cotización de dotación<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid anos qué necesitas y te respondemos con disponibilidad, precio por rollo y tiempos de despacho.<\u002Fp>\n      <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ trackWhatsapp }}\" style=\"display:inline-flex; align-items:center; gap:10px; background:var(--cta); color:var(--surface); padding:15px 24px; border-radius:999px; font-size:15px; font-weight:600;\" style-hover=\"background:var(--cta-hover);\">Hablar con un asesor<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:16px; justify-content:center; border-left:1px solid var(--field-line); padding-left:56px;\">\n      <p style=\"margin:0; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--inv-eyebrow);\">Cómo pedir<\u002Fp>\n      <ol style=\"margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:14px;\">\n        <sc-for list=\"{{ pasos }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <li style=\"display:flex; gap:14px; align-items:flex-start;\">\n            <span style=\"width:26px; height:26px; border-radius:50%; border:1px solid var(--field-line); color:var(--inv-eyebrow); font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:none;\">{{ p.n }}<\u002Fspan>\n            <span style=\"font-size:15px; line-height:1.55; color:var(--inv-muted);\">{{ p.texto }}<\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n      <div style=\"margin-top:6px; padding-top:18px; border-top:1px solid var(--field-line); font-size:14px; color:var(--inv-muted);\">\n        Escríbenos a <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ trackWhatsapp }}\" style=\"color:var(--inv-fg); font-weight:600;\">{{ waDisplay }}<\u002Fa> · Lun a sáb desde las 9:00\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:64px 0;\">\n    <h2 style=\"margin:0 0 28px; font-family:'Instrument Sans','Inter',sans-serif; font-size:38px; font-weight:600; letter-spacing:-0.03em;\">Preguntas frecuentes<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:1fr; gap:0; border-top:1px solid var(--line); max-width:820px;\">\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <details style=\"border-bottom:1px solid var(--line); padding:20px 0;\">\n          <summary style=\"display:flex; justify-content:space-between; gap:24px; font-size:17px; font-weight:500;\">\n            {{ f.q }}\n            <span style=\"color:var(--accent); font-weight:400;\">+<\u002Fspan>\n          <\u002Fsummary>\n          <p style=\"margin:12px 0 0; font-size:15px; line-height:1.65; color:var(--muted); max-width:62ch;\">{{ f.a }}<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"ubicacion\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:40px; padding:0 0 64px;\">\n    <div style=\"min-height:340px; border:1px solid var(--line2); border-radius:8px; overflow:hidden; background:var(--ph1);\">\n      <iframe title=\"Ubicación de Telas de Colombia en Medellín\" src=\"https://www.google.com/maps?q=Calle%2055%20%2345-14%2C%20La%20Candelaria%2C%20Medell%C3%ADn%2C%20Antioquia&amp;output=embed\" width=\"100%\" height=\"100%\" style=\"border:0; display:block; min-height:340px;\" loading=\"lazy\" sc-camel-referrer-policy=\"no-referrer-when-downgrade\" sc-camel-allow-full-screen=\"\"><\u002Fiframe>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:22px; justify-content:center;\">\n      <h2 style=\"margin:0; font-family:'Instrument Sans','Inter',sans-serif; font-size:38px; font-weight:600; letter-spacing:-0.03em;\">Visítanos<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:20px; font-size:15px; line-height:1.6;\">\n        <div>\n          <div style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--faint); margin-bottom:6px;\">Dirección<\u002Fdiv>\n          {{ direccion }}<br>{{ ciudad }}<br>\n          <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=Calle+55+%2345-14%2C+La+Candelaria%2C+Medell%C3%ADn\" target=\"_blank\" rel=\"noopener\" style=\"font-size:14px; font-weight:500;\">Cómo llegar →<\u002Fa>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--faint); margin-bottom:6px;\">Horario<\u002Fdiv>\n          Lun a vie desde 9:00<br>Sáb desde 9:00\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--faint); margin-bottom:6px;\">WhatsApp<\u002Fdiv>\n          <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ trackWhatsapp }}\">{{ waDisplay }}<\u002Fa>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--faint); margin-bottom:6px;\">Envíos<\u002Fdiv>\n          A todo el país, 24–72 h\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ trackWhatsapp }}\" style=\"align-self:flex-start; display:inline-flex; align-items:center; gap:10px; background:var(--cta); color:var(--surface); padding:15px 24px; border-radius:999px; font-size:15px; font-weight:600;\" style-hover=\"background:var(--cta-hover);\">Cotizar por WhatsApp<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; padding:26px 0 40px; border-top:1px solid var(--line); font-size:13px; color:var(--faint);\">\n    <span>© 2026 Telas de Colombia By Grupo Macasi<\u002Fspan>\n    <div style=\"display:flex; gap:20px;\">\n      <a href=\"https://www.instagram.com/telascolombia_grupomacasi/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--muted);\">Instagram<\u k\" ? \"dark\" : \"light\");\n  }\n  applyTheme() {\n    if (typeof document !== \"undefined\") document.body.dataset.theme = this.theme;\n  }\n  componentDidMount() {\n    this.applyTheme();\n    if (typeof document !== \"undefined\") document.documentElement.lang = \"es-CO\";\n  }\n  track(name, params) {\n    if (typeof window === \"undefined\") return;\n    if (typeof window.fbq === \"function\") window.fbq(\"track\", name === \"Lead\" ? \"Lead\" : \"Contact\", params);\n    if (typeof window.gtag === \"function\") {\n      window.gtag(\"event\", \"conversion\", {\n        send_to: window.GOOGLE_ADS_ID + \"/\" + window.GOOGLE_ADS_CONVERSION_LABEL,\n        event_category: \"contacto\",\n        event_label: (params && params.content_name) || name\n      });\n    }\n  }\n  componentDidUpdate() { this.applyTheme(); }\n  renderVals() {\n    const raw = this.props.whatsappNumber ?? \"+57 318 626 2626\";\n    const digits = String(raw).replace(/\\D/g, \"\");\n    const telas = [\n      { nombre: \"Seda natural\", desc: \"Caída fluida, ideal para blusas y forros de alta gama.\", slot: \"seda — foto de catálogo\" },\n      { nombre: \"Satín\", desc: \"Brillo parejo y buen cuerpo para vestidos y eventos.\", slot: \"satín — foto de catálogo\" },\n      { nombre: \"Algodón\", desc: \"Fresco y resistente, en lisos y estampados.\", slot: \"algodón — foto de catálogo\" },\n      { nombre: \"Dril\", desc: \"Para dotaciones y uniformes que aguantan uso diario.\", slot: \"dril — foto de catálogo\" },\n      { nombre: \"Licra\", desc: \"Elasticidad de recuperación para deportivo y control.\", slot: \"licra — foto de catálogo\" },\n      { nombre: \"Combinaciones\", desc: \"Te armamos la paleta completa para tu colección.\", slot: \"paleta de colores\" }\n    ];\n    const razones = [\n      { titulo: \"Precio por rollo real\", texto: \"Tarifa de mayorista desde el primer rollo, sin intermediarios.\" },\n      { titulo: \"Muestras antes de comprar\", texto: \"Te enviamos el catálogo y muestras físicas para confirmar color y textura.\" },\n      { titulo: \"Inventario disponible\", texto: \"Más de 400 referencias en bodega, despacho el mismo día.\" },\n      { titulo: \"Asesoría de taller\", texto: \"Te decimos qué tela rinde mejor según la prenda y el uso.\" }\n    ];\n    const testimonios = [\n      { cita: \"Pedimos 30 rollos de dril y llegaron completos en dos días.\", autor: \"Marcela Ruiz\", rol: \"Confecciones MR, Medellín\" },\n      { cita: \"El catálogo me evitó equivocarme de color en toda la colección.\", autor: \"Andrés Peña\", rol: \"Diseñador independiente\" },\n      { cita: \"Responden por WhatsApp en minutos y con precio claro.\", autor: \"Taller La Aguja\", rol: \"Cali\" }\n    ];\n    const faqs = [\n      { q: \"¿Cuál es el pedido mínimo?\", a: \"Al detal vendemos desde 1 metro. Para precio de mayorista, desde 1 rollo completo.\" },\n      { q: \"¿Hacen envíos a todo el país?\", a: \"Sí. Despachamos a todo Colombia con entrega entre 24 y 72 horas según la ciudad.\" },\n      { q: \"¿Puedo ver la tela antes de comprar?\", a: \"Puedes visitarnos en el local o pedir el catálogo y muestras físicas de las referencias que te interesen.\" },\n      { q: \"¿Por qué no publican precios?\", a: \"El precio varía por cantidad y referencia. Escríbenos por WhatsApp y cotizamos en el momento.\" },\n      { q: \"¿Qué formas de pago aceptan?\", a: \"Transferencia bancaria y efectivo en el local. No manejamos pago contra entrega.\" }\n    ];\n    return {\n      telas, razones, testimonios, faqs,\n      waDisplay: raw,\n      waLink: \"https://wa.me/\" + digits,\n      themeLabel: this.theme === \"dark\" ? \"Modo claro\" : \"Modo oscuro\",\n      toggleTheme: () => this.setState({ theme: this.theme === \"dark\" ? \"light\" : \"dark\" }),\n      pasos: [\n        { n: \"1\", texto: \"Escríbenos por WhatsApp con la tela, la cantidad y el color que buscas.\" },\n        { n: \"2\", texto: \"Te enviamos fotos reales, disponibilidad y precio por rollo el mismo día.\" },\n        { n: \"3\", texto: \"Confirmas el pedido y despachamos a tu ciudad en 24–72 horas.\" }\n      ],\n      direccion: this.props.direccion ?? \"Cl. 55 #45-14, La Candelaria\",\n      ciudad: this.props.ciudad ?? \"Medellín, Antioquia\",\n      googleRating: this.props.googleRating ?? \"4.9\",\n      googleCount: this.props.googleCount ?? 147,\n      googleStars: \"★★★★★\",\n      googleReviewsUrl: this.props.googleReviewsUrl ?? \"https://www.google.com/search?q=Telas+de+Colombia+SAS+Medell%C3%ADn+rese%C3%B1as\",\n      reviews: [\n        { estrellas: \"★★★★★\", fecha: \"Hace 2 meses\", inicial: \"M\", autor: \"Cliente de Google\", texto: \"Excelente atención y calidad en las telas. Cumplieron con el pedido completo y a tiempo.\" },\n        { estrellas: \"★★★★★\", fecha: \"Hace 4 meses\", inicial: \"J\", autor: \"Cliente de Google\", texto: \"Muy buena asesoría para elegir la tela de la dotación de nuestro equipo. Precio justo.\" },\n        { estrellas: \"★★★★★\", fecha: \"Hace 6 meses\", inicial: \"L\", autor: \"Cliente de Google\", texto: \"Responden rápido por WhatsApp y el despacho llegó sin problemas a otra ciudad.\" }\n      ],\n      trackWhatsapp: () => this.track(\"Contact\", { content_name: \"whatsapp\" }),\n      trackLead: () => this.track(\"Lead\", { content_name: \"mayoristas\" })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
